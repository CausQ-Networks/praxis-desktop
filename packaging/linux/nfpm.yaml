# Builds the deb, rpm and Arch packages: see "make package-linux".
# VERSION, GOARCH and BINARY come from the environment.
name: praxis-client
arch: ${GOARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: "1"
section: net
priority: optional
maintainer: CausQ Networks <support@praxis.causq.com>
vendor: CausQ Networks
homepage: https://praxis.net
license: AGPL-3.0-only
description: |
  Praxis client.
  Connects this computer to your Praxis networks, with a tray menu and
  settings window. A background service manages the tunnel.

overrides:
  deb:
    depends:
      - libgtk-3-0t64 | libgtk-3-0
      - libwebkit2gtk-4.1-0
  rpm:
    depends:
      # Fedora names, or openSUSE's.
      - (gtk3 or libgtk-3-0)
      - (webkit2gtk4.1 or libwebkit2gtk-4_1-0)
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

contents:
  - src: ${BINARY}
    dst: /usr/bin/praxis-client
    expand: true
    file_info:
      mode: 0755
  - src: packaging/linux/praxis-client.service
    dst: /usr/lib/systemd/system/praxis-client.service
  - src: packaging/linux/praxis-client.desktop
    dst: /usr/share/applications/praxis-client.desktop
  - src: packaging/linux/praxis-client-autostart.desktop
    dst: /etc/xdg/autostart/praxis-client-autostart.desktop
    type: config|noreplace
  - src: packaging/linux/com.causq.praxis.client.policy
    dst: /usr/share/polkit-1/actions/com.causq.praxis.client.policy
  - src: packaging/linux/praxis-client.png
    dst: /usr/share/icons/hicolor/256x256/apps/praxis-client.png
  - src: packaging/linux/gnome-shell-extension/praxis@causq.com/metadata.json
    dst: /usr/share/gnome-shell/extensions/praxis@causq.com/metadata.json
  - src: packaging/linux/gnome-shell-extension/praxis@causq.com/extension.js
    dst: /usr/share/gnome-shell/extensions/praxis@causq.com/extension.js
  # Tells the in-app updater how this copy was installed.
  - src: packaging/linux/package-format/deb
    dst: /usr/share/praxis-client/package-format
    packager: deb
  - src: packaging/linux/package-format/rpm
    dst: /usr/share/praxis-client/package-format
    packager: rpm
  - src: packaging/linux/package-format/archlinux
    dst: /usr/share/praxis-client/package-format
    packager: archlinux

scripts:
  postinstall: packaging/linux/scripts/postinstall.sh
  preremove: packaging/linux/scripts/preremove.sh
  postremove: packaging/linux/scripts/postremove.sh

archlinux:
  packager: CausQ Networks <support@praxis.causq.com>
  scripts:
    postupgrade: packaging/linux/scripts/postupgrade-arch.sh
